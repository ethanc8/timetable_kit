[tool.poetry]
name = "timetable_kit"
version = "0.0.0.dev0"
description = "Kit for making printable timetables for trains and buses"
authors = ["Nathanael Nerode <ncn_floss10@fastmail.fm>"]
license = "GNU Affero General Public License v3.0 or later"

[tool.poetry.dependencies]
python = "^3.11"
gtfs-kit = ">=6.0.0"
pandas = ">=2.1.4"
Jinja2 = ">=3.1.2"
weasyprint = ">=60.2"
lxml = ">=5.0.0"
xdg-base-dirs = "^6.0.1"
tomlkit = "^0.12.3"

[tool.poetry.group.dev.dependencies]
black = ">=23.12.1"
mypy = ">=1.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
gtfs-kit = ">=6.0.0,<7.0"
pandas = ">=2.1.4"
Jinja2 = ">=3.1.2"
weasyprint = ">=60.2"
lxml = ">=5.0.0"
xdg-base-dirs = ">=6.0.1,<7.0"
tomlkit = ">=0.12.3,<0.13"
timetable_kit = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "==3.11"
pytz = ">=2026.1.post1,<2027"
